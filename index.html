<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Form</title>
  <style>
    body { font-family: sans-serif; max-width: 400px; margin: 60px auto; }
    input, textarea { display: block; width: 100%; margin: 10px 0; padding: 8px; }
    button { padding: 10px 20px; cursor: pointer; }
    #status { margin-top: 10px; }
  </style>
</head>
<body>
  <h2>Contact Us</h2>
  <form id="myForm">
    <input type="text" id="name" placeholder="Your Name" required>
    <input type="email" id="email" placeholder="Your Email" required>
    <textarea id="message" placeholder="Your Message" required></textarea>
    <button type="submit">Send</button>
  </form>
  <div id="status"></div>

  <script>
    const WEBHOOK_URL = "https://your-n8n-instance.com/webhook/abc123-def456";

    document.getElementById("myForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const data = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        message: document.getElementById("message").value
      };

      document.getElementById("status").innerText = "Sending...";

      try {
        const res = await fetch(WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });

        if (res.ok) {
          document.getElementById("status").innerText = "✅ Sent successfully!";
          e.target.reset();
        } else {
          document.getElementById("status").innerText = "❌ Failed to send.";
        }
      } catch (err) {
        document.getElementById("status").innerText = "❌ Error: " + err.message;
      }
    });
  </script>
</body>
</html>
